; Alternative to the Arduino IDE build in the README:
;
;   pio run -d Firmware
;
; espressif32 3.5.0 is the platform release that ships ESP32 Arduino core
; 1.0.6. Newer cores do not compile the GFX library this firmware targets.
; The libraries come from the zips in Libraries/ rather than the PlatformIO
; registry, so this builds against the same versions the firmware was
; verified with.

[platformio]
src_dir = TinyMaker_Firmware_v1_0_2

[env:esp32dev]
platform = espressif32@3.5.0
board = esp32dev
framework = arduino
board_build.partitions = TinyMaker_Firmware_v1_0_2/partitions.csv
lib_deps =
  file://Libraries/AccelStepper-1.64.0.zip
  file://Libraries/Arduino_GFX-1.2.0.zip
  file://Libraries/PNGdec-1.0.1.zip
  file://Libraries/SdFat-1.1.2.zip
